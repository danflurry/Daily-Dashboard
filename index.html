<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101714"><title>Daily Dashboard</title><link rel="stylesheet" href="styles.css"></head><body>
<main class="shell"><header><div><p class="eyebrow">DAILY DASHBOARD</p><h1 id="date">Today</h1><p id="theme" class="muted"></p></div><div class="score"><strong id="score">0/0</strong><span>complete</span></div></header>
<section id="snapshot" class="snapshot"></section><section id="cards" class="grid"></section>
<footer><button id="export">Export data</button><label class="import">Import data<input id="import" type="file" accept="application/json"></label><p>Today's card is dealt once. You can play it; you can't redraw it.</p></footer></main>
<script src="app.js"></script></body></html>
